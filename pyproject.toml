[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slowlab"
version = "2.3.0.dev0"
description = "A benchmark for experimental-design agents under slow, noisy, costly, irreversible experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
weather = ["h5py>=3.8"]
llm = ["certifi"]        # needed by python.org builds of Python on macOS to verify TLS certificates
dev = ["pytest>=7.0"]
analysis = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["slowlab", "slowlab.archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the development environment in line with newer NumPy: deprecation warnings are
# errors. NumPy 2.x turned float(size-1 array) from a warning into a TypeError; without
# this setting, problems of that kind only blow up on someone else's machine.
filterwarnings = ["error::DeprecationWarning"]
